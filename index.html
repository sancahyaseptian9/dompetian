<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dompetian.com - Spidey Edition</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --text-muted: #8d99ae;
            --primary: #d90429; /* Merah Spider-Man */
            --secondary: #1d3557; /* Biru klasik */
            --success: #2a9d8f;
            --danger: #e63946;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --shadow: 0 4px 14px rgba(217, 4, 41, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #0b090a;
            --card-bg: #161a1d;
            --text-color: #f1faee;
            --text-muted: #a3bac3;
            --primary: #ff1e38; /* Merah neon terang */
            --secondary: #457b9d; /* Biru malam */
            --success: #2dc653;
            --danger: #ff4d6d;
            --border-color: #283038;
            --input-bg: #1f2429;
            --shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 5px;
            border-bottom: 2px dashed var(--primary);
            padding-bottom: 12px;
        }

        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .logo-area span {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
            font-weight: 600;
        }

        .btn-theme {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        /* Kartu Saldo */
        .balance-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg) 100%);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid var(--secondary);
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .balance-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-card h2 {
            font-size: 2.1rem;
            margin-bottom: 16px;
            font-weight: 800;
            color: var(--primary);
        }

        .summary-row {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }

        .summary-item p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .summary-item span {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .income-text { color: var(--success); }
        .expense-text { color: var(--danger); }

        /* Form Input */
        .form-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .form-card h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--secondary);
        }

        [data-theme="dark"] .form-card h3 {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217, 4, 41, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 6px;
            box-shadow: 0 4px 10px rgba(217, 4, 41, 0.3);
        }

        .btn-submit:active {
            opacity: 0.85;
        }

        /* Riwayat Transaksi */
        .history-section h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .transaction-list {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .transaction-item {
            background-color: var(--card-bg);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--secondary);
            box-shadow: var(--shadow);
        }

        .transaction-item.income { border-left-color: var(--success); }
        .transaction-item.expense { border-left-color: var(--primary); }

        .t-info h4 {
            font-size: 0.9rem;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .t-info small {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .t-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .t-amount {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 6px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <h1>🕷️ dompetian.com</h1>
                <span>Spidey Finance Tracker</span>
            </div>
            <button class="btn-theme" id="themeToggle" onclick="toggleTheme()">🌙 Mode</button>
        </header>

        <!-- Kartu Saldo -->
        <div class="balance-card">
            <h3>Sisa Saldo Jaring</h3>
            <h2 id="totalBalance">Rp 0</h2>
            <div class="summary-row">
                <div class="summary-item">
                    <p>Pemasukan</p>
                    <span id="totalIncome" class="income-text">Rp 0</span>
                </div>
                <div class="summary-item">
                    <p>Pengeluaran</p>
                    <span id="totalExpense" class="expense-text">Rp 0</span>
                </div>
            </div>
        </div>

        <!-- Form Tambah Catatan -->
        <div class="form-card">
            <h3>Tambah Catatan Spidey</h3>
            <form id="transactionForm" onsubmit="addTransaction(event)">
                <div class="form-group">
                    <label for="description">Keterangan</label>
                    <input type="text" id="description" placeholder="Contoh: Joki tugas, Beli kostum..." required>
                </div>
                <div class="form-group">
                    <label for="amount">Jumlah (Rp)</label>
                    <input type="number" id="amount" placeholder="Contoh: 75000" required>
                </div>
                <div class="form-group">
                    <label for="type">Tipe Transaksi</label>
                    <select id="type">
                        <option value="income">Pemasukan</option>
                        <option value="expense">Pengeluaran</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Kategori</label>
                    <select id="category">
                        <option value="Umum">Umum</option>
                        <option value="Makanan">Makanan & Minuman</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Belanja">Belanja</option>
                        <option value="Hiburan">Hiburan</option>
                        <option value="Gaji">Gaji / Pendapatan</option>
                        <option value="Pahlawan">Pahlawan / Darurat</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Simpan Catatan</button>
            </form>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="history-section">
            <h3>Riwayat Jaring Keuangan</h3>
            <ul id="transactionList" class="transaction-list">
                <!-- Data masuk otomatis -->
            </ul>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('dompetian_spidey_trans')) || [];

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function updateUI() {
            const listElement = document.getElementById('transactionList');
            const balanceElement = document.getElementById('totalBalance');
            const incomeElement = document.getElementById('totalIncome');
            const expenseElement = document.getElementById('totalExpense');

            listElement.innerHTML = '';
            let totalIncome = 0;
            let totalExpense = 0;

            if (transactions.length === 0) {
                listElement.innerHTML = `<li class="empty-state">Belum ada jaring catatan di dompetian.com 🕸️</li>`;
            }

            transactions.forEach((t, index) => {
                if (t.type === 'income') {
                    totalIncome += Number(t.amount);
                } else {
                    totalExpense += Number(t.amount);
                }

                const li = document.createElement('li');
                li.classList.add('transaction-item', t.type);
                li.innerHTML = `
                    <div class="t-info">
                        <h4>${t.description}</h4>
                        <small>${t.category} • ${t.date}</small>
                    </div>
                    <div class="t-right">
                        <span class="t-amount ${t.type === 'income' ? 'income-text' : 'expense-text'}">
                            ${t.type === 'income' ? '+' : '-'} ${formatRupiah(t.amount)}
                        </span>
                        <button class="btn-delete" onclick="deleteTransaction(${index})">&times;</button>
                    </div>
                `;
                listElement.appendChild(li);
            });

            const totalBalance = totalIncome - totalExpense;
            balanceElement.innerText = formatRupiah(totalBalance);
            incomeElement.innerText = formatRupiah(totalIncome);
            expenseElement.innerText = formatRupiah(totalExpense);

            localStorage.setItem('dompetian_spidey_trans', JSON.stringify(transactions));
        }

        function addTransaction(e) {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

            transactions.unshift({ description, amount, type, category, date: dateStr });
            updateUI();
            document.getElementById('transactionForm').reset();
        }

        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggle');
            
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                themeBtn.innerText = '☀️ Terang';
                localStorage.setItem('dompetian_spidey_theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                themeBtn.innerText = '🌙 Mode';
                localStorage.setItem('dompetian_spidey_theme', 'light');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('dompetian_spidey_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️ Terang' : '🌙 Mode';
            updateUI();
        }
    </script>
</body>
</html>
