<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dompetian.com - Monthly Summary</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-color: #2b2d42;
            --text-muted: #8d99ae;
            --primary: #d90429;
            --secondary: #1d3557;
            --success: #2a9d8f;
            --danger: #e63946;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #0b090a;
            --card-bg: rgba(22, 26, 29, 0.92);
            --text-color: #f1faee;
            --text-muted: #a3bac3;
            --primary: #ff1e38;
            --secondary: #457b9d;
            --success: #2dc653;
            --danger: #ff4d6d;
            --border-color: #283038;
            --input-bg: #1f2429;
            --shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px 15px;
            border-bottom: 2px dashed var(--primary);
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(5px);
        }

        .logo-area h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .logo-area span {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            font-weight: 600;
        }

        .header-btns {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        /* Widget Hari & Tanggal */
        .date-widget {
            background: var(--card-bg);
            padding: 8px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            backdrop-filter: blur(5px);
        }

        /* Kartu Saldo */
        .balance-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid var(--secondary);
            backdrop-filter: blur(5px);
        }

        .balance-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-card h2 {
            font-size: 2.1rem;
            margin-bottom: 16px;
            font-weight: 800;
            color: var(--primary);
        }

        .summary-row {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }

        .summary-item p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .summary-item span {
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* Kartu Akumulasi Bulanan */
        .monthly-card {
            background: var(--card-bg);
            padding: 15px 18px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }

        .monthly-card h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        [data-theme="dark"] .monthly-card h3 {
            color: var(--primary);
        }

        .monthly-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            background: var(--input-bg);
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .m-stat-item span {
            display: block;
            font-weight: 700;
        }

        .income-text { color: var(--success); }
        .expense-text { color: var(--danger); }

        /* Form Input */
        .form-card {
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }

        .form-card h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--secondary);
        }

        [data-theme="dark"] .form-card h3 {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217, 4, 41, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 6px;
            box-shadow: 0 4px 10px rgba(217, 4, 41, 0.3);
        }

        /* Riwayat Transaksi */
        .history-section h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .transaction-list {
            list-style: none;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .transaction-item {
            background-color: var(--card-bg);
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--secondary);
            box-shadow: var(--shadow);
            backdrop-filter: blur(5px);
        }

        .transaction-item.income { border-left-color: var(--success); }
        .transaction-item.expense { border-left-color: var(--primary); }

        .t-info h4 {
            font-size: 0.9rem;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .t-info small {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .t-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .t-amount {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 2px 6px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 25px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <h1>🕷️ dompetian.com</h1>
                <span>Monthly Summary Edition</span>
            </div>
            <div class="header-btns">
                <button class="btn-action" onclick="document.getElementById('bgUpload').click()">🖼️ Foto</button>
                <input type="file" id="bgUpload" accept="image/*" style="display: none;" onchange="changeBackground(event)">
                <button class="btn-action" id="themeToggle" onclick="toggleTheme()">🌙</button>
            </div>
        </header>

        <!-- Widget Tanggal -->
        <div class="date-widget" id="dateWidget">
            Memuat tanggal...
        </div>

        <!-- Kartu Saldo -->
        <div class="balance-card">
            <h3>Sisa Saldo Jaring</h3>
            <h2 id="totalBalance">Rp 0</h2>
            <div class="summary-row">
                <div class="summary-item">
                    <p>Total Pemasukan</p>
                    <span id="totalIncome" class="income-text">Rp 0</span>
                </div>
                <div class="summary-item">
                    <p>Total Pengeluaran</p>
                    <span id="totalExpense" class="expense-text">Rp 0</span>
                </div>
            </div>
        </div>

        <!-- Kartu Akumulasi / Rekap Bulanan -->
        <div class="monthly-card">
            <h3>📅 Rekap Bulan Ini <span id="currentMonthLabel" style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);"></span></h3>
            <div class="monthly-stats">
                <div class="m-stat-item">
                    <p style="font-size: 0.75rem; color: var(--text-muted);">Masuk Bulan Ini</p>
                    <span id="monthlyIncome" class="income-text">Rp 0</span>
                </div>
                <div class="m-stat-item" style="text-align: right;">
                    <p style="font-size: 0.75rem; color: var(--text-muted);">Keluar Bulan Ini</p>
                    <span id="monthlyExpense" class="expense-text">Rp 0</span>
                </div>
            </div>
        </div>

        <!-- Form Tambah Catatan -->
        <div class="form-card">
            <h3>Tambah Catatan Spidey</h3>
            <form id="transactionForm" onsubmit="addTransaction(event)">
                <div class="form-group">
                    <label for="description">Keterangan</label>
                    <input type="text" id="description" placeholder="Contoh: Joki tugas, Beli kostum..." required>
                </div>
                <div class="form-group">
                    <label for="amount">Jumlah (Rp)</label>
                    <input type="number" id="amount" placeholder="Contoh: 75000" required>
                </div>
                <div class="form-group">
                    <label for="type">Tipe Transaksi</label>
                    <select id="type">
                        <option value="income">Pemasukan</option>
                        <option value="expense">Pengeluaran</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Kategori</label>
                    <select id="category">
                        <option value="Umum">Umum</option>
                        <option value="Makanan">Makanan & Minuman</option>
                        <option value="Transportasi">Transportasi</option>
                        <option value="Belanja">Belanja</option>
                        <option value="Hiburan">Hiburan</option>
                        <option value="Gaji">Gaji / Pendapatan</option>
                        <option value="Pahlawan">Pahlawan / Darurat</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Simpan Catatan</button>
            </form>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="history-section">
            <h3>Riwayat Jaring Keuangan</h3>
            <ul id="transactionList" class="transaction-list">
                <!-- Data masuk otomatis -->
            </ul>
        </div>
    </div>

    <script>
        // Menggunakan kunci penyimpanan lama agar data tidak hilang
        let transactions = JSON.parse(localStorage.getItem('dompetian_custom_trans')) || [];

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        // Tampilkan Hari, Tanggal, Tahun
        function updateDateWidget() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateWidget').innerText = now.toLocaleDateString('id-ID', options);
        }

        function updateUI() {
            const listElement = document.getElementById('transactionList');
            const balanceElement = document.getElementById('totalBalance');
            const incomeElement = document.getElementById('totalIncome');
            const expenseElement = document.getElementById('totalExpense');
            
            const monthlyIncomeEl = document.getElementById('monthlyIncome');
            const monthlyExpenseEl = document.getElementById('monthlyExpense');
            const currentMonthLabel = document.getElementById('currentMonthLabel');

            listElement.innerHTML = '';
            let totalIncome = 0;
            let totalExpense = 0;
            let monthlyIncome = 0;
            let monthlyExpense = 0;

            // Mendapatkan bulan dan tahun saat ini untuk akumulasi (format misal: "September 2026")
            const now = new Date();
            const currentMonthName = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            currentMonthLabel.innerText = `(${currentMonthName})`;

            if (transactions.length === 0) {
                listElement.innerHTML = `<li class="empty-state">Belum ada jaring catatan di dompetian.com 🕸️</li>`;
            }

            transactions.forEach((t, index) => {
                const amountNum = Number(t.amount);

                if (t.type === 'income') {
                    totalIncome += amountNum;
                } else {
                    totalExpense += amountNum;
                }

                // Cek apakah transaksi masuk dalam bulan dan tahun berjalan
                // t.rawDate disimpan dalam format ISO date string atau kita bandingkan string bulannya
                if (t.rawMonthYear === currentMonthName) {
                    if (t.type === 'income') {
                        monthlyIncome += amountNum;
                    } else {
                        monthlyExpense += amountNum;
                    }
                }

                const li = document.createElement('li');
                li.classList.add('transaction-item', t.type);
                li.innerHTML = `
                    <div class="t-info">
                        <h4>${t.description}</h4>
                        <small>${t.category} • ${t.date}</small>
                    </div>
                    <div class="t-right">
                        <span class="t-amount ${t.type === 'income' ? 'income-text' : 'expense-text'}">
                            ${t.type === 'income' ? '+' : '-'} ${formatRupiah(t.amount)}
                        </span>
                        <button class="btn-delete" onclick="deleteTransaction(${index})">&times;</button>
                    </div>
                `;
                listElement.appendChild(li);
            });

            const totalBalance = totalIncome - totalExpense;
            balanceElement.innerText = formatRupiah(totalBalance);
            incomeElement.innerText = formatRupiah(totalIncome);
            expenseElement.innerText = formatRupiah(totalExpense);

            monthlyIncomeEl.innerText = formatRupiah(monthlyIncome);
            monthlyExpenseEl.innerText = formatRupiah(monthlyExpense);

            localStorage.setItem('dompetian_custom_trans', JSON.stringify(transactions));
        }

        function addTransaction(e) {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            const monthYearStr = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

            transactions.unshift({ 
                description, 
                amount, 
                type, 
                category, 
                date: dateStr,
                rawMonthYear: monthYearStr // Penanda untuk akumulasi bulanan
            });
            
            updateUI();
            document.getElementById('transactionForm').reset();
        }

        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        // Ganti Latar Belakang dari Galeri HP
        function changeBackground(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    document.body.style.backgroundImage = `url('${imageUrl}')`;
                    localStorage.setItem('dompetian_bg_image', imageUrl);
                }
                reader.readAsDataURL(file);
            }
        }

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeToggle');
            
            if (body.getAttribute('data-theme') === 'light') {
                body.setAttribute('data-theme', 'dark');
                themeBtn.innerText = '☀️';
                localStorage.setItem('dompetian_custom_theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                themeBtn.innerText = '🌙';
                localStorage.setItem('dompetian_custom_theme', 'light');
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('dompetian_custom_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
            
            const savedBg = localStorage.getItem('dompetian_bg_image');
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            }

            // Migrasi data lama jika belum ada rawMonthYear agar tidak error
            const now = new Date();
            const currentMonthName = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            transactions.forEach(t => {
                if (!t.rawMonthYear) t.rawMonthYear = currentMonthName;
            });

            updateDateWidget();
            updateUI();
        }
    </script>
</body>
</html>
