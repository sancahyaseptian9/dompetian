<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dompetian.com - Clean & Minimalist Edition</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7; /* Biru bersih profesional */
            --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #030712;
            --card-bg: #111827;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #38bdf8;
            --primary-gradient: linear-gradient(135deg, #0284c7 0%, #0f172a 100%);
            --success: #34d399;
            --danger: #f87171;
            --border-color: #1f2937;
            --input-bg: #1f2937;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Lockscreen Simpel */
        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        .lock-card {
            background: var(--card-bg);
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .lock-card h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 4px;
            font-weight: 800;
        }

        .lock-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .pin-input {
            letter-spacing: 8px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 10px;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: none;
        }

        /* Header Bersih (Tanpa Bubble) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 12px 16px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .logo-area h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .logo-area span {
            font-size: 0.65rem;
            color: var(--text-muted);
            display: block;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Navigasi Tab Minimalis */
        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .date-widget {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
            padding-left: 4px;
        }

        /* Kartu Saldo Elegan */
        .balance-card {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
            margin-bottom: 14px;
        }

        .balance-card h3 {
            font-size: 0.7rem;
            opacity: 0.85;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .balance-card h2 {
            font-size: 1.8rem;
            margin-bottom: 14px;
            font-weight: 800;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 12px;
        }

        .summary-item p {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .summary-item span {
            font-weight: 700;
            font-size: 0.85rem;
        }

        .income-text-card { color: #6ee7b7; }
        .expense-text-card { color: #fca5a5; }

        /* Kartu Rekap Bulanan */
        .monthly-card {
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .monthly-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .monthly-header h3 {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .monthly-header select {
            width: auto;
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        .monthly-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            background: var(--input-bg);
            padding: 8px 12px;
            border-radius: 10px;
        }

        .income-text { color: var(--success); font-weight: 700; }
        .expense-text { color: var(--danger); font-weight: 700; }

        /* Kartu Form Simpel */
        .form-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .form-card h3 {
            font-size: 0.9rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: var(--text-muted);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 4px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
        }

        /* Riwayat */
        .history-section h3 {
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .transaction-list {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .transaction-item {
            background-color: var(--card-bg);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .t-info h4 {
            font-size: 0.8rem;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .t-info small {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .t-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .t-amount {
            font-weight: 700;
            font-size: 0.8rem;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }

        /* Target Tabungan Minimalis */
        .goal-item {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .goal-header h4 {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .progress-bar-container {
            width: 100%;
            background: var(--border-color);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-bar {
            height: 100%;
            background: var(--success);
            width: 0%;
            border-radius: 8px;
        }

        .goal-calc-info {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--input-bg);
            padding: 6px 8px;
            border-radius: 8px;
            margin-top: 6px;
        }

        .btn-add-fund {
            width: 100%;
            padding: 7px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body data-theme="light">

    <!-- Lockscreen -->
    <div id="lockScreen">
        <div class="lock-card">
            <h2>dompetian.com</h2>
            <p id="lockMessage">Masukkan PIN Keamanan</p>
            <form onsubmit="verifyPin(event)">
                <div class="form-group">
                    <input type="password" id="pinInput" class="pin-input" maxlength="6" placeholder="••••" required autofocus>
                </div>
                <button type="submit" class="btn-submit">Buka Aplikasi</button>
            </form>
            <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
                <button type="button" onclick="resetPinEmergency()" style="background: none; border: none; color: var(--danger); font-size: 0.7rem; cursor: pointer; font-weight: 600;">Lupa PIN?</button>
                <span style="font-size: 0.68rem; color: var(--text-muted);">Default: <b>1234</b></span>
            </div>
        </div>
    </div>

    <!-- Utama -->
    <div class="container" id="mainApp">
        <header>
            <div class="logo-area">
                <h1>dompetian.com</h1>
                <span>Personal Finance</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" id="themeToggle">🌙</button>
                <button class="icon-btn" onclick="toggleBackgroundMenu()">⚙️ BG</button>
                <button class="icon-btn" onclick="changePinPrompt()">🔒 PIN</button>
            </div>
        </header>

        <!-- Menu Pengaturan Background (Muncul saat tombol BG diklik) -->
        <div id="bgSettingsMenu" class="form-card" style="display: none; margin-bottom: 14px;">
            <h3 style="font-size: 0.8rem; margin-bottom: 8px;">Pengaturan Wallpaper</h3>
            <div style="display: flex; gap: 6px;">
                <button class="icon-btn" style="flex: 1;" onclick="document.getElementById('bgUpload').click()">📁 Pilih Foto</button>
                <button class="icon-btn" style="flex: 1; color: var(--danger);" onclick="removeBackground()">🚫 Hapus BG (Polos)</button>
            </div>
            <input type="file" id="bgUpload" accept="image/*" style="display: none;" onchange="changeBackground(event)">
        </div>

        <!-- Tab Navigasi -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabDompet" onclick="switchTab('dompet')">Dompet Utama</button>
            <button class="tab-btn" id="tabTarget" onclick="switchTab('target')">Target Impian</button>
        </div>

        <!-- Halaman 1: Dompet -->
        <div id="pageDompet" class="page-section active">
            <div class="date-widget" id="dateWidget">Memuat tanggal...</div>

            <div class="balance-card">
                <h3>Total Sisa Saldo</h3>
                <h2 id="totalBalance">Rp 0</h2>
                <div class="summary-row">
                    <div class="summary-item">
                        <p>Pemasukan</p>
                        <span id="totalIncome" class="income-text-card">Rp 0</span>
                    </div>
                    <div class="summary-item">
                        <p>Pengeluaran</p>
                        <span id="totalExpense" class="expense-text-card">Rp 0</span>
                    </div>
                </div>
            </div>

            <div class="monthly-card">
                <div class="monthly-header">
                    <h3>Rekap Bulanan</h3>
                    <select id="monthSelect" onchange="updateUI()">
                    </select>
                </div>
                <div class="monthly-stats">
                    <div>
                        <p style="font-size: 0.68rem; color: var(--text-muted);">Masuk</p>
                        <span id="monthlyIncome" class="income-text">Rp 0</span>
                    </div>
                    <div style="text-align: right;">
                        <p style="font-size: 0.68rem; color: var(--text-muted);">Keluar</p>
                        <span id="monthlyExpense" class="expense-text">Rp 0</span>
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h3>Catat Transaksi</h3>
                <form id="transactionForm" onsubmit="addTransaction(event)">
                    <div class="form-group">
                        <label for="description">Keterangan</label>
                        <input type="text" id="description" placeholder="Contoh: Makan siang, Joki..." required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="amount">Nominal (Rp)</label>
                        <input type="number" id="amount" placeholder="Contoh: 25000" required>
                    </div>
                    <div class="form-group">
                        <label for="type">Tipe</label>
                        <select id="type">
                            <option value="income">Pemasukan</option>
                            <option value="expense">Pengeluaran</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Kategori</label>
                        <select id="category">
                            <option value="Umum">Umum</option>
                            <option value="Makanan">Makanan & Minuman</option>
                            <option value="Transportasi">Transportasi</option>
                            <option value="Belanja">Belanja</option>
                            <option value="Hiburan">Hiburan</option>
                            <option value="Gaji">Gaji / Pendapatan</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Simpan Transaksi</button>
                </form>
            </div>

            <div class="history-section">
                <h3>Riwayat</h3>
                <ul id="transactionList" class="transaction-list">
                </ul>
            </div>
        </div>

        <!-- Halaman 2: Target -->
        <div id="pageTarget" class="page-section">
            <div class="form-card">
                <h3>Buat Target Tabungan</h3>
                <form id="goalForm" onsubmit="addGoal(event)">
                    <div class="form-group">
                        <label for="goalName">Nama Impian</label>
                        <input type="text" id="goalName" placeholder="Contoh: Beli Buku Baru" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="goalTargetAmount">Total Harga (Rp)</label>
                        <input type="number" id="goalTargetAmount" placeholder="Contoh: 150000" required>
                    </div>
                    <div class="form-group">
                        <label for="goalSavedAmount">Terkumpul Awal (Rp)</label>
                        <input type="number" id="goalSavedAmount" placeholder="0" value="0" required>
                    </div>
                    <div class="form-group">
                        <label for="goalPeriod">Rencana</label>
                        <select id="goalPeriod">
                            <option value="daily">Per Hari</option>
                            <option value="weekly">Per Minggu</option>
                            <option value="monthly">Per Bulan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="goalRoutineAmount">Nabung Rutin (Rp)</label>
                        <input type="number" id="goalRoutineAmount" placeholder="Contoh: 5000" required>
                    </div>
                    <button type="submit" class="btn-submit">Simpan Target</button>
                </form>
            </div>

            <div class="history-section">
                <h3>Daftar Target</h3>
                <div id="goalList">
                </div>
            </div>
        </div>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('dompetian_custom_trans')) || [];
        let savingsGoals = JSON.parse(localStorage.getItem('dompetian_custom_goals')) || [];

        function verifyPin(e) {
            e.preventDefault();
            const enteredPin = document.getElementById('pinInput').value;
            let currentPin = localStorage.getItem('dompetian_user_pin') || '1234';

            if (enteredPin === currentPin) {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.body.style.alignItems = 'flex-start';
                initApp();
            } else {
                document.getElementById('lockMessage').innerText = "PIN Salah!";
                document.getElementById('lockMessage').style.color = "var(--danger)";
                document.getElementById('pinInput').value = '';
            }
        }

        function resetPinEmergency() {
            if (confirm("Reset PIN ke default (1234)?")) {
                localStorage.setItem('dompetian_user_pin', '1234');
                alert("PIN direset ke 1234.");
                document.getElementById('lockMessage').innerText = "Masukkan PIN Keamanan";
                document.getElementById('lockMessage').style.color = "var(--text-muted)";
            }
        }

        function changePinPrompt() {
            const oldPin = prompt("Masukkan PIN lama:");
            let currentPin = localStorage.getItem('dompetian_user_pin') || '1234';
            if (oldPin === currentPin) {
                const newPin = prompt("Masukkan PIN baru (min 4 digit):");
                if (newPin && newPin.length >= 4) {
                    localStorage.setItem('dompetian_user_pin', newPin);
                    alert("PIN berhasil diubah!");
                } else {
                    alert("PIN tidak valid.");
                }
            } else if (oldPin !== null) {
                alert("PIN lama salah!");
            }
        }

        function switchTab(tabName) {
            document.getElementById('tabDompet').classList.toggle('active', tabName === 'dompet');
            document.getElementById('tabTarget').classList.toggle('active', tabName === 'target');
            document.getElementById('pageDompet').classList.toggle('active', tabName === 'dompet');
            document.getElementById('pageTarget').classList.toggle('active', tabName === 'target');
            if(tabName === 'target') updateGoalUI();
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function updateDateWidget() {
            const now = new Date();
            document.getElementById('dateWidget').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function populateMonthDropdown() {
            const monthSelect = document.getElementById('monthSelect');
            const currentSelected = monthSelect.value;
            let monthsSet = new Set();
            const now = new Date();
            const currentMonthName = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            
            monthsSet.add(currentMonthName);
            transactions.forEach(t => { if (t.rawMonthYear) monthsSet.add(t.rawMonthYear); });

            let monthsArray = Array.from(monthsSet);
            monthSelect.innerHTML = '';
            monthsArray.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.innerText = m;
                monthSelect.appendChild(opt);
            });
            monthSelect.value = monthsArray.includes(currentSelected) ? currentSelected : currentMonthName;
        }

        function updateUI() {
            populateMonthDropdown();
            const listElement = document.getElementById('transactionList');
            const selectedMonth = document.getElementById('monthSelect').value;

            listElement.innerHTML = '';
            let totalIncome = 0, totalExpense = 0, monthlyIncome = 0, monthlyExpense = 0;

            if (transactions.length === 0) {
                listElement.innerHTML = `<li class="empty-state">Belum ada transaksi tercatat.</li>`;
            }

            transactions.forEach((t, index) => {
                const amountNum = Number(t.amount);
                if (t.type === 'income') totalIncome += amountNum;
                else totalExpense += amountNum;

                if (t.rawMonthYear === selectedMonth) {
                    if (t.type === 'income') monthlyIncome += amountNum;
                    else monthlyExpense += amountNum;
                }

                const li = document.createElement('li');
                li.classList.add('transaction-item');
                li.innerHTML = `
                    <div class="t-info">
                        <h4>${t.description}</h4>
                        <small>${t.category} • ${t.date}</small>
                    </div>
                    <div class="t-right">
                        <span class="t-amount ${t.type === 'income' ? 'income-text' : 'expense-text'}">
                            ${t.type === 'income' ? '+' : '-'} ${formatRupiah(t.amount)}
                        </span>
                        <button class="btn-delete" onclick="deleteTransaction(${index})">&times;</button>
                    </div>
                `;
                listElement.appendChild(li);
            });

            document.getElementById('totalBalance').innerText = formatRupiah(totalIncome - totalExpense);
            document.getElementById('totalIncome').innerText = formatRupiah(totalIncome);
            document.getElementById('totalExpense').innerText = formatRupiah(totalExpense);
            document.getElementById('monthlyIncome').innerText = formatRupiah(monthlyIncome);
            document.getElementById('monthlyExpense').innerText = formatRupiah(monthlyExpense);

            localStorage.setItem('dompetian_custom_trans', JSON.stringify(transactions));
        }

        function addTransaction(e) {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;
            const now = new Date();

            transactions.unshift({ 
                description, amount, type, category, 
                date: now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }),
                rawMonthYear: now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })
            });
            updateUI();
            document.getElementById('transactionForm').reset();
        }

        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        function addGoal(e) {
            e.preventDefault();
            savingsGoals.unshift({
                name: document.getElementById('goalName').value,
                targetAmount: Number(document.getElementById('goalTargetAmount').value),
                savedAmount: Number(document.getElementById('goalSavedAmount').value),
                period: document.getElementById('goalPeriod').value,
                routineAmount: Number(document.getElementById('goalRoutineAmount').value)
            });
            updateGoalUI();
            document.getElementById('goalForm').reset();
            alert("Target berhasil dibuat!");
        }

        function addFundToGoal(index) {
            const input = prompt("Masukkan jumlah uang tambahan (Rp):");
            const addAmount = Number(input);
            if (addAmount > 0 && !isNaN(addAmount)) {
                savingsGoals[index].savedAmount += addAmount;
                updateGoalUI();
            } else if (input !== null) {
                alert("Nominal tidak valid.");
            }
        }

        function updateGoalUI() {
            const goalListEl = document.getElementById('goalList');
            goalListEl.innerHTML = '';

            if (savingsGoals.length === 0) {
                goalListEl.innerHTML = `<div class="empty-state">Belum ada target impian.</div>`;
                return;
            }

            savingsGoals.forEach((g, index) => {
                const kekurangan = g.targetAmount - g.savedAmount;
                let percentage = Math.min(100, (g.savedAmount / g.targetAmount) * 100);
                let timeText = kekurangan <= 0 ? "🎉 Target tercapai!" : `Estimasi tercapai dalam <b>${Math.ceil(kekurangan / g.routineAmount)} ${g.period === 'daily' ? 'Hari' : (g.period === 'weekly' ? 'Minggu' : 'Bulan')}</b> lagi.`;

                const div = document.createElement('div');
                div.classList.add('goal-item');
                div.innerHTML = `
                    <div class="goal-header">
                        <h4>${g.name}</h4>
                        <button class="btn-delete" onclick="deleteGoal(${index})">&times;</button>
                    </div>
                    <p style="font-size: 0.72rem; color: var(--text-muted);">Terkumpul: <b>${formatRupiah(g.savedAmount)}</b> dari ${formatRupiah(g.targetAmount)}</p>
                    <div class="progress-bar-container"><div class="progress-bar" style="width: ${percentage}%"></div></div>
                    <div class="goal-calc-info">💡 Nabung ${formatRupiah(g.routineAmount)}/${g.period === 'daily' ? 'hari' : (g.period === 'weekly' ? 'minggu' : 'bulan')}.<br>${timeText}</div>
                    <button class="btn-add-fund" onclick="addFundToGoal(${index})">+ Tambah Tabungan</button>
                `;
                goalListEl.appendChild(div);
            });
            localStorage.setItem('dompetian_custom_goals', JSON.stringify(savingsGoals));
        }

        function deleteGoal(index) {
            savingsGoals.splice(index, 1);
            updateGoalUI();
        }

        function toggleBackgroundMenu() {
            const menu = document.getElementById('bgSettingsMenu');
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }

        function changeBackground(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imageUrl = e.target.result;
                    document.body.style.backgroundImage = `url('${imageUrl}')`;
                    document.getElementById('lockScreen').style.backgroundImage = `url('${imageUrl}')`;
                    localStorage.setItem('dompetian_bg_image', imageUrl);
                    toggleBackgroundMenu();
                }
                reader.readAsDataURL(file);
            }
        }

        function removeBackground() {
            document.body.style.backgroundImage = 'none';
            document.getElementById('lockScreen').style.backgroundImage = 'none';
            localStorage.removeItem('dompetian_bg_image');
            toggleBackgroundMenu();
        }

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggle').innerText = newTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('dompetian_custom_theme', newTheme);
        }

        function initApp() {
            const savedTheme = localStorage.getItem('dompetian_custom_theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
            
            const savedBg = localStorage.getItem('dompetian_bg_image');
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
                document.getElementById('lockScreen').style.backgroundImage = `url('${savedBg}')`;
            }

            const now = new Date();
            const currentMonthName = now.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            transactions.forEach(t => { if (!t.rawMonthYear) t.rawMonthYear = currentMonthName; });

            updateDateWidget();
            updateUI();
            updateGoalUI();
        }
    </script>
</body>
</html>
